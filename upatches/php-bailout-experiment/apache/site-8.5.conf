<VirtualHost *:18080>
    ServerName localhost
    DocumentRoot /opt/shirudo/php2shell/www
    <Directory /opt/shirudo/php2shell/www>
        Require all granted
        php_admin_value memory_limit 8M
        php_admin_value display_errors On
        php_admin_value fatal_error_backtraces On
    </Directory>
    <Directory /opt/shirudo/php2shell/www/early>
        php_value auto_detect_line_endings On
    </Directory>
    ErrorLog /var/log/apache2/php2shell-error.log
    CustomLog /var/log/apache2/php2shell-access.log combined
</VirtualHost>
