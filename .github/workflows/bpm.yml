name: BPM

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-26.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: bpm/go.mod
          cache-dependency-path: bpm/go.sum

      - name: Run Go tests
        working-directory: bpm
        run: go test ./...

  make-targets:
    runs-on: ubuntu-26.04
    needs: test
    strategy:
      fail-fast: false
      matrix:
        target:
          - all
          - tarballs
          - packages
          - release

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: bpm/go.mod
          cache-dependency-path: bpm/go.sum

      - name: Test make ${{ matrix.target }}
        working-directory: bpm
        run: make ${{ matrix.target }}
