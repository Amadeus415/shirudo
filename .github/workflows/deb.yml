name: Build deb

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:

permissions:
  contents: read

jobs:
  deb:
    runs-on: ubuntu-latest-4cores-16gb

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out bpf-next submodule
        run: |
          git submodule sync -- third_party/bpf-next
          git submodule update --init --force --depth 1 --single-branch -- third_party/bpf-next

      - name: Determine build version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            version=$REF_NAME
          else
            version=$(git describe --tags --always --dirty)
          fi
          mkdir -p build
          printf '%s\n' "$version" > build/ci-version

      - name: Build deb package and run shirudo in LVH VM
        uses: cilium/little-vm-helper@v0.0.30
        with:
          test-name: shirudo-apt
          image: kind
          image-version: bpf-next-20260603.072225
          kernel-version: bpf-next-main
          host-mount: ${{ github.workspace }}
          images-folder-parent: ${{ github.workspace }}/../lvh
          install-dependencies: true
          cpu: 4
          mem: 8G
          cmd: |
            grep -qw bpf /sys/kernel/security/lsm
            grep -aq 'signature_size' /sys/kernel/btf/vmlinux || {
              echo 'kernel BTF lacks bpf_attr.signature_size; needs a signed-BPF capable bpf-next kernel' >&2
              exit 1
            }
            cd /host

            apt-get update
            apt-get install -y --no-install-recommends \
              build-essential \
              ca-certificates \
              default-jdk \
              clang \
              llvm \
              python3 \
              pkg-config \
              autoconf \
              autoconf-archive \
              automake \
              doxygen \
              libacl1-dev \
              libftdi1-dev \
              libini-config-dev \
              libmbedtls-dev \
              libssl-dev \
              libjitterentropy3-dev \
              libfido2-dev \
              libtss2-dev \
              libelf-dev \
              zlib1g-dev \
              libcurl4-openssl-dev \
              libjson-c-dev \
              libtool \
              libtool-bin \
              libltdl-dev \
              libusb-1.0-0-dev \
              libluajit-5.1-dev \
              uuid-dev \
              dpkg-dev \
              curl \
              binutils \
              file \
              git

            git config --global --add safe.directory /host

            # Build the static target dependencies outside the /host mount.
            # The recursive Make-based builder crashes in the LVH guest, so
            # keep this CI-only path explicit and pass the staged paths below.
            rm -rf /tmp/shirudo-target-deps /tmp/shirudo-mbedtls-curl /tmp/curl-8.18.0
            mkdir -p /tmp/shirudo-target-deps/lib

            curl -fsSL https://curl.se/download/curl-8.18.0.tar.xz \
              -o /tmp/curl-8.18.0.tar.xz
            tar -C /tmp -xf /tmp/curl-8.18.0.tar.xz
            cd /tmp/curl-8.18.0
            ./configure \
              --prefix=/tmp/shirudo-mbedtls-curl \
              --with-mbedtls=/usr \
              --enable-static \
              --disable-shared
            make -j4
            make install

            git clone --depth 1 --branch 4.1.3 \
              https://github.com/tpm2-software/tpm2-tss.git \
              /tmp/shirudo-target-deps/tpm2-tss
            cd /tmp/shirudo-target-deps/tpm2-tss
            ./bootstrap
            ./configure \
              --prefix=/tmp/shirudo-target-deps \
              --libdir=/tmp/shirudo-target-deps/lib \
              --enable-static \
              --disable-shared \
              --disable-fapi \
              --disable-policy \
              --disable-tcti-cmd \
              --disable-tcti-i2c-ftdi \
              --disable-tcti-i2c-helper \
              --disable-tcti-libtpms \
              --disable-tcti-pcap \
              --disable-tcti-spi-ftdi \
              --disable-tcti-spi-helper \
              --disable-tcti-spi-ltt2go \
              --disable-tcti-spidev \
              --disable-tcti-mssim \
              --disable-tcti-swtpm
            make -j4
            make install

            install -m 0644 /usr/lib/x86_64-linux-gnu/libcrypto.a /tmp/shirudo-target-deps/lib/libcrypto.a
            install -m 0644 /usr/lib/x86_64-linux-gnu/libjitterentropy.a /tmp/shirudo-target-deps/lib/libjitterentropy.a
            install -m 0644 /usr/lib/x86_64-linux-gnu/libelf.a /tmp/shirudo-target-deps/lib/libelf.a
            install -m 0644 /usr/lib/x86_64-linux-gnu/libz.a /tmp/shirudo-target-deps/lib/libz.a
            install -m 0644 /usr/lib/x86_64-linux-gnu/libluajit-5.1.a /tmp/shirudo-target-deps/lib/libluajit-5.1.a

            cd /host

            # Read the workflow version through /host so it also reaches the VM.
            # LVH expands cmd in a host-side heredoc; escape guest-side dollars.
            export SHIRUDO_CI_VERSION="\$(cat build/ci-version)"
            test -n "\$SHIRUDO_CI_VERSION"
            deb_version=\$(printf '%s' "\$SHIRUDO_CI_VERSION" | \
              sed 's/^v//; s/[^A-Za-z0-9.+:~-]/./g; /^[0-9]/!s/^/0~/')
            test -n "\$deb_version"
            make bindeb-pkg \
              DEB_RAW_VERSION="\$SHIRUDO_CI_VERSION" \
              DEB_VERSION="\$deb_version" \
              SHIRUDO_GIT_DESCRIBE='printenv SHIRUDO_CI_VERSION' \
              TARGET_DEPS_PREBUILT=1 \
              SHIRUDO_TARGET_PKG_CONFIG_PATH=/tmp/shirudo-mbedtls-curl/lib/pkgconfig:/usr/lib/x86_64-linux-gnu/pkgconfig \
              SHIRUDO_TARGET_MBEDTLS_INCLUDEDIR=/usr/include \
              SHIRUDO_TARGET_MBEDTLS_LIBDIR=/usr/lib/x86_64-linux-gnu \
              SHIRUDO_TARGET_STATIC_LIBDIR=/tmp/shirudo-target-deps/lib

            # These libraries must be present in the target executable rather
            # than in its DT_NEEDED list.
            ! readelf -d shirudo-target | grep -Eq \
              'lib(rtmp|psl|z|tss2-esys|tss2-tctildr|elf|luajit-5\.1)\.so'

            apt-get update
            apt-get install -y /host/shirudo-operator_*.deb

            /usr/bin/shirudo genkey

            # Verify that shirudo build works without a local copy of vmlinux.h
            pushd examples
            # TODO: shirudo build should include multiarch include path.
            shirudo build verifier-reject-null-deref.bpf.c --extra-cflags "-I/usr/include/\$(gcc -dumpmachine)"
            popd

            apt-get remove -y shirudo-operator

      - name: Upload deb package
        uses: actions/upload-artifact@v4
        with:
          name: shirudo-deb
          path: shirudo-*.deb
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: deb
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download deb packages
        uses: actions/download-artifact@v4
        with:
          name: shirudo-deb

      - name: Upload packages to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" shirudo-*.deb --clobber
          else
            gh release create "$RELEASE_TAG" shirudo-*.deb \
              --draft --verify-tag --title "$RELEASE_TAG" --generate-notes
          fi
