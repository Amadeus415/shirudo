name: Build deb

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:

jobs:
  deb:
    runs-on: ubuntu-latest-4cores-16gb

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out bpf-next submodule
        run: |
          git submodule sync -- third_party/bpf-next
          git submodule update --init --force --depth 1 --single-branch -- third_party/bpf-next

      - name: Build deb package and run shirudo in LVH VM
        uses: cilium/little-vm-helper@v0.0.30
        with:
          test-name: shirudo-apt
          image: kind
          image-version: bpf-next-20260603.072225
          kernel-version: bpf-next-main
          host-mount: ${{ github.workspace }}
          images-folder-parent: ${{ github.workspace }}/../lvh
          install-dependencies: true
          cpu: 4
          mem: 8G
          cmd: |
            grep -qw bpf /sys/kernel/security/lsm
            grep -aq 'signature_size' /sys/kernel/btf/vmlinux || {
              echo 'kernel BTF lacks bpf_attr.signature_size; needs a signed-BPF capable bpf-next kernel' >&2
              exit 1
            }
            cd /host

            apt-get update
            apt-get install -y --no-install-recommends \
              build-essential \
              ca-certificates \
              default-jdk \
              clang \
              llvm \
              python3 \
              pkg-config \
              autoconf \
              autoconf-archive \
              automake \
              doxygen \
              libacl1-dev \
              libftdi-dev \
              libini-config-dev \
              libmbedtls-dev \
              libssl-dev \
              libssh-dev \
              libtss2-dev \
              libelf-dev \
              zlib1g-dev \
              libcurl4-openssl-dev \
              libjson-c-dev \
              libtool \
              libtool-bin \
              libltdl-dev \
              libusb-1.0-0-dev \
              libluajit-5.1-dev \
              uuid-dev \
              dpkg-dev \
              curl \
              binutils \
              file \
              git

            git config --global --add safe.directory /host

            # Ubuntu ships the TPM2-TSS shared libraries but not their static
            # archives. Build the static target-side runtime closure in a
            # private prefix and stage the distro archives beside it.
            target_deps=/tmp/shirudo-target-deps
            target_static_libdir="$target_deps/lib"
            target_curl_prefix=/tmp/shirudo-mbedtls-curl
            target_multiarch="$(dpkg-architecture -qDEB_HOST_MULTIARCH)"
            rm -rf "$target_deps" "$target_curl_prefix" /tmp/curl-8.18.0
            mkdir -p "$target_static_libdir"

            curl -fsSL https://curl.se/download/curl-8.18.0.tar.xz \
              -o /tmp/curl-8.18.0.tar.xz
            tar -C /tmp -xf /tmp/curl-8.18.0.tar.xz
            cd /tmp/curl-8.18.0
            ./configure \
              --prefix="$target_curl_prefix" \
              --with-mbedtls=/usr \
              --enable-static \
              --disable-shared
            make -j"$(nproc)"
            make install

            git clone --depth 1 --branch 4.1.3 \
              https://github.com/tpm2-software/tpm2-tss.git \
              "$target_deps/tpm2-tss"
            cd "$target_deps/tpm2-tss"
            ./bootstrap
            ./configure \
              --prefix="$target_deps" \
              --libdir="$target_static_libdir" \
              --enable-static \
              --disable-shared \
              --disable-fapi \
              --disable-policy \
              --disable-tcti-cmd \
              --disable-tcti-i2c-ftdi \
              --disable-tcti-i2c-helper \
              --disable-tcti-libtpms \
              --disable-tcti-pcap \
              --disable-tcti-spi-ftdi \
              --disable-tcti-spi-helper \
              --disable-tcti-spi-ltt2go \
              --disable-tcti-spidev \
              --disable-tcti-mssim \
              --disable-tcti-swtpm
            make -j"$(nproc)"
            make install

            for archive in libssh.a libelf.a libz.a libluajit-5.1.a; do
              install -m 0644 \
                "/usr/lib/$target_multiarch/$archive" \
                "$target_static_libdir/$archive"
            done

            # The LVH /host mount makes git dirty checks expensive. For CI,
            # use a fixed package/runtime version instead of asking git.
            make bindeb-pkg \
              DEB_RAW_VERSION=0.0.0-ci \
              DEB_VERSION=0.0.0-ci \
              SHIRUDO_GIT_DESCRIBE='printf 0.0.0-ci' \
              SHIRUDO_TARGET_PKG_CONFIG_PATH="$target_curl_prefix/lib/pkgconfig:/usr/lib/$target_multiarch/pkgconfig" \
              SHIRUDO_TARGET_MBEDTLS_INCLUDEDIR=/usr/include \
              SHIRUDO_TARGET_MBEDTLS_LIBDIR="/usr/lib/$target_multiarch" \
              SHIRUDO_TARGET_STATIC_LIBDIR="$target_static_libdir"

            # These libraries must be present in the target executable rather
            # than in its DT_NEEDED list.
            ! readelf -d shirudo-target | grep -Eq \
              'lib(rtmp|psl|z|ssh|tss2-esys|tss2-tctildr|elf|luajit-5\.1)\.so'

            apt-get update
            apt-get install -y /host/shirudo-operator_*.deb

            /usr/bin/shirudo genkey

            # Verify that shirudo build works without a local copy of vmlinux.h
            pushd examples
            # TODO: shirudo build should include multiarch include path.
            shirudo build verifier-reject-null-deref.bpf.c --extra-cflags "-I/usr/include/\$(gcc -dumpmachine)"
            popd

            apt-get remove -y shirudo-operator

      - name: Upload deb package
        uses: actions/upload-artifact@v4
        with:
          name: shirudo-deb
          path: shirudo-*.deb
          if-no-files-found: error
