name: Build kernel deb package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest-4cores-16gb
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Free disk space
        run: |
          sudo rm -rf /opt/ghc /usr/local/lib/android /usr/share/dotnet || true
          sudo apt-get clean

      - name: Build kernel debs
        env:
          KERNEL_PATCHES: kernel/
        run: contrib/build-kernel-deb.sh

      - name: Upload kernel deb bundle
        uses: actions/upload-artifact@v4
        with:
          name: bpf-next-kernel-debs-amd64
          retention-days: 14
          path: |
            artifacts/bpf-next-kernel-debs.tar.gz
            artifacts/bpf-next-kernel-debs.tar.gz.sha256sum
