name: Build bpf-next kernel artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest-4cores-16gb
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Free disk space
        run: |
          sudo rm -rf /opt/ghc /usr/local/lib/android /usr/share/dotnet || true
          sudo apt-get clean

      - name: Install kernel build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc \
            bison \
            build-essential \
            ca-certificates \
            cpio \
            debhelper \
            dpkg-dev \
            dwarves \
            fakeroot \
            flex \
            git \
            kmod \
            libdw-dev \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            llvm \
            openssl \
            pahole \
            python3 \
            rsync \
            xz-utils \
            zstd

      - name: Build bpf-next kernel artifacts
        run: make bpf-next

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bpf-next-kernel-debs-amd64
          retention-days: 14
          path: |
            artifacts/bpf-next-kernel-debs.tar.gz
            artifacts/bpf-next-kernel-debs.tar.gz.sha256sum
            artifacts/bpf-next-kernel-debs/bzImage
            artifacts/bpf-next-kernel-debs/bzImage.sha256sum
            artifacts/bpf-next-kernel-debs/vmlinux.btf
            artifacts/bpf-next-kernel-debs/vmlinux.btf.sha256sum
            artifacts/bpf-next-kernel-debs/bpf-next-kernel-build
